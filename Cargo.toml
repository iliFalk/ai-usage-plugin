[package]
name = "ai-usagebar"
version = "1.45.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Data source for the Omarchy AI Usage panel: quota and balance for OpenCode Go, DeepSeek and OpenRouter"
authors = ["Ilja <ilja@falknest.net>"]
readme = "README.md"
repository = "https://github.com/iliFalk/ai-usage-plugin"
homepage = "https://github.com/iliFalk/ai-usage-plugin"
documentation = "https://github.com/iliFalk/ai-usage-plugin#readme"
keywords = ["omarchy", "quickshell", "usage", "quota"]
categories = ["command-line-utilities"]

exclude = [
    "screenshot.png",
    "screenshots/*",
    "packaging/*",
    ".github/*",
    ".claude/*",
]

# cargo-binstall metadata: tells `cargo binstall ai-usagebar` how to find the
# prebuilt binary already published in each GitHub Release, so users without
# rustup don't need to compile from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ai-usagebar-linux-{ target-arch }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "ai_usagebar"
path = "src/lib.rs"

[[bin]]
name = "ai-usagebar"
path = "src/bin/ai-usagebar.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process", "signal", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
fs2 = "0.4"
tempfile = "3"
directories = "6"
thiserror = "2"
sha2 = { version = "0.11", default-features = false }
unicode-width = "0.2"
# Reads the official OpenCode CLI's own `opencode.db` (its on-disk session
# store) to find the key it already wrote there. "bundled" statically links
# SQLite via cc, so no system libsqlite3-dev is required — keeping the AUR
# source build's hermeticity.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }

[dev-dependencies]
mockito = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
