name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to build (e.g. v1.46.0)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  # Nothing verified that the artifacts about to be published carry the version
  # the tag claims. At v0.13.0 the packaging `.SRCINFO` files still said 0.8.0
  # while Cargo.toml said 0.13.0, and the release went out anyway. Everything
  # downstream depends on this job.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Tags are needed to prove a workflow_dispatch ref is a real tag.
          fetch-depth: 0

      - id: check
        name: Tag, manifests, changelog and packaging must agree
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          case "$ref" in
            v*) ;;
            *) echo "::error::refusing to publish from '$ref' — releases must build a vX.Y.Z tag"; exit 1 ;;
          esac
          version="${ref#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$ref' is not a vX.Y.Z tag"; exit 1
          fi
          # A workflow_dispatch ref must be an existing tag, not an arbitrary commit.
          git rev-parse -q --verify "refs/tags/$ref" >/dev/null \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }
          if [ "$(git cat-file -t "refs/tags/$ref")" != "tag" ]; then
            echo "::error::tag '$ref' is lightweight; releases require an annotated tag"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "refs/tags/$ref")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main \
            || { echo "::error::tag '$ref' does not point to a commit on main"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          check "Cargo.toml version" \
            "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$version"
          check "Omarchy plugin version" \
            "$(jq -r '.version' manifest.json)" "$version"
          check "PKGBUILD pkgver" \
            "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2)" "$version"
          check "PKGBUILD-bin pkgver" \
            "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD-bin | cut -d= -f2)" "$version"
          check ".SRCINFO pkgver" \
            "$(grep -m1 'pkgver = ' packaging/aur/.SRCINFO | awk '{print $3}')" "$version"
          check ".SRCINFO-bin pkgver" \
            "$(grep -m1 'pkgver = ' packaging/aur/.SRCINFO-bin | awk '{print $3}')" "$version"

          check_pkgbuild_checksum_parity() {
            local file="$1"
            (
              unset "${!source@}" "${!sha256sums@}" 2>/dev/null || true
              # shellcheck disable=SC1090
              source "$file"
              local sub_fail=0
              local suffixes=()
              for v in ${!source@}; do
                suffixes+=("${v#source}")
              done
              for v in ${!sha256sums@}; do
                local sfx="${v#sha256sums}"
                local seen=0
                if [ "${#suffixes[@]}" -gt 0 ]; then
                  for s in "${suffixes[@]}"; do
                    if [ "$s" = "$sfx" ]; then seen=1; break; fi
                  done
                fi
                if [ "$seen" -eq 0 ]; then suffixes+=("$sfx"); fi
              done
              if [ "${#suffixes[@]}" -eq 0 ]; then
                echo "::error::$file declares no source or sha256sums arrays"
                exit 1
              fi
              for sfx in "${suffixes[@]}"; do
                local src_var="source$sfx"
                local sha_var="sha256sums$sfx"
                local src_len=0
                local sha_len=0
                if declare -p "$src_var" &>/dev/null; then
                  eval "src_len=\${#$src_var[@]}"
                fi
                if declare -p "$sha_var" &>/dev/null; then
                  eval "sha_len=\${#$sha_var[@]}"
                fi
                if [ "$src_len" -ne "$sha_len" ]; then
                  echo "::error::$file: $src_var ($src_len elements) and $sha_var ($sha_len elements) differ in length"
                  sub_fail=1
                fi
              done
              exit "$sub_fail"
            ) || fail=1
          }

          check_srcinfo_checksum_parity() {
            local file="$1"
            (
              local sub_fail=0
              local keys
              keys=$(grep -E "^[[:space:]]*(source|sha256sums)(_[a-zA-Z0-9_]+)?[[:space:]]*=" "$file" \
                | awk -F"=" '{print $1}' | tr -d " \t" | sort -u)
              local suffixes=()
              for k in $keys; do
                local sfx=""
                if [[ "$k" =~ ^source(_.*)$ ]]; then
                  sfx="${BASH_REMATCH[1]}"
                elif [[ "$k" =~ ^sha256sums(_.*)$ ]]; then
                  sfx="${BASH_REMATCH[1]}"
                fi
                local seen=0
                if [ "${#suffixes[@]}" -gt 0 ]; then
                  for s in "${suffixes[@]}"; do
                    if [ "$s" = "$sfx" ]; then seen=1; break; fi
                  done
                fi
                if [ "$seen" -eq 0 ]; then suffixes+=("$sfx"); fi
              done
              for sfx in "${suffixes[@]}"; do
                local src_key="source$sfx"
                local sha_key="sha256sums$sfx"
                local src_count
                src_count=$(grep -c -E "^[[:space:]]*$src_key[[:space:]]*=" "$file" || true)
                local sha_count
                sha_count=$(grep -c -E "^[[:space:]]*$sha_key[[:space:]]*=" "$file" || true)
                if [ "$src_count" -ne "$sha_count" ]; then
                  echo "::error::$file: $src_key ($src_count lines) and $sha_key ($sha_count lines) differ in count"
                  sub_fail=1
                fi
              done
              exit "$sub_fail"
            ) || fail=1
          }

          check_pkgbuild_checksum_parity packaging/aur/PKGBUILD
          check_pkgbuild_checksum_parity packaging/aur/PKGBUILD-bin
          check_srcinfo_checksum_parity packaging/aur/.SRCINFO
          check_srcinfo_checksum_parity packaging/aur/.SRCINFO-bin

          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  build:
    needs: [verify-version]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ai-usagebar-linux-x86_64
            builder: cargo
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: ai-usagebar-linux-aarch64
            builder: cross

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          key: ${{ matrix.target }}

      - name: Test the panel's contract
        run: make plugin-test

      - name: Install nasm (x86_64 native build; ring assembles its primitives)
        if: matrix.builder == 'cargo'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install cross (aarch64 cross-compile via Docker)
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cross

      - name: Test (native only — aarch64 binaries can't run on x86 runner)
        if: matrix.builder == 'cargo'
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Build release binary
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }} --locked

      - name: Create tarball (binary + LICENSE + config example)
        run: |
          STAGE=$(mktemp -d)
          cp target/${{ matrix.target }}/release/ai-usagebar "$STAGE/"
          cp LICENSE README.md config.example.toml "$STAGE/"
          tar czf ${{ matrix.artifact }}.tar.gz -C "$STAGE" .
          rm -rf "$STAGE"

      - name: Compute SHA256
        run: |
          SHA=$(sha256sum ${{ matrix.artifact }}.tar.gz | awk '{print $1}')
          echo "$SHA  ${{ matrix.artifact }}.tar.gz" > ${{ matrix.artifact }}.tar.gz.sha256
          echo "Built ${{ matrix.artifact }}.tar.gz sha256=$SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    # Only this job publishes anything to the repo; the rest read.
    permissions:
      contents: write
    steps:
      - name: Checkout source (for CHANGELOG + previous tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release body
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # `-Fxv "$TAG"`: -F treats TAG as a fixed string (dots aren't regex
          # wildcards), -x requires whole-line match. Robust against the dots
          # in version strings like `v0.4.1`.
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -1)

          # Extract matching section from CHANGELOG.md (between "## [VERSION]"
          # and the next "## [" header). Empty file if no match.
          # `index(s, t) == 1` is a string prefix-equality match — no regex,
          # so dots in `ver` (e.g. `0.4.1`) stay literal.
          awk -v ver="$VERSION" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > changelog_section.md

          {
            if [ -s changelog_section.md ]; then
              echo "## What's changed"
              echo
              cat changelog_section.md
            fi

            echo "## Install"
            echo
            echo "This binary is the data source the **Omarchy AI Usage panel** runs;"
            echo "the panel itself is this repository's Quattro plugin"
            echo "(\`omarchy/\`, installed with \`omarchy plugin install\`)."
            echo
            echo "### Arch (AUR)"
            echo
            echo '```bash'
            echo "yay -S ai-usagebar-bin      # prebuilt binary from this release"
            echo "yay -S ai-usagebar          # compiles from source"
            echo '```'
            echo
            echo "### Manual"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ai-usagebar-linux-x86_64.tar.gz | tar xz -C ~/.local/bin ai-usagebar"
            echo '```'
            echo
            echo "## Checksums (SHA256)"
            echo '```'
            cat artifacts/*.sha256
            echo '```'

            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi
          } > body.md

      # Opt-in PGP signing (#257). Without the GPG_PRIVATE_KEY secret this
      # pair of steps is skipped and the release is byte-for-byte what it
      # was before. The presence probe mirrors the AUR secret check: the
      # secrets context is not readable from a step `if:`, so a prior step
      # exports the verdict. The key still travels via env indirection (never
      # inline `${{ }}` expansion into the script) and the passphrase reaches
      # gpg on stdin — never in argv.
      - name: Check GPG signing key presence
        id: gpg_key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release artifacts (opt-in)
        if: steps.gpg_key.outputs.set == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="${RUNNER_TEMP}/signing-key.asc"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$keyfile"
          gpg --batch --import "$keyfile"
          rm -f "$keyfile"
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          fingerprint=$(gpg --list-secret-keys --with-colons "$keyid" | awk -F: '/^fpr/{print $10; exit}')
          echo "Signing as ${fingerprint}"

          # Detached ASCII signatures for every downloadable artifact. The
          # .sha256 sidecars stay unsigned on purpose: they are derived
          # data, and a tampered sidecar makes the checksum check fail
          # closed against the signed artifact itself. A passphraseless
          # key must NOT take the --passphrase-fd path: gpg reads the
          # empty line and fails with "No passphrase given" (the v1.28.0
          # first-run failure), so the fd-0 loopback is only wired when a
          # passphrase actually exists.
          sign() {
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --detach-sign --armor --output "$1.sig" "$1" <<<"$GPG_PASSPHRASE"
            else
              gpg --batch --yes --pinentry-mode loopback \
                --detach-sign --armor --output "$1.sig" "$1"
            fi
          }
          shopt -s nullglob
          for f in artifacts/*.tar.gz; do
            sign "$f"
          done

          # The public key rides along so verification needs no keyserver.
          gpg --armor --export "$keyid" > artifacts/ai-usagebar-signing-key.asc

          {
            echo
            echo "## Verifying signatures"
            echo
            echo '```bash'
            echo "curl -fsSL -O https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ai-usagebar-signing-key.asc"
            echo "gpg --import ai-usagebar-signing-key.asc   # ${fingerprint}"
            echo "curl -fsSL -O https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ai-usagebar-linux-x86_64.tar.gz.sig"
            echo "gpg --verify ai-usagebar-linux-x86_64.tar.gz.sig ai-usagebar-linux-x86_64.tar.gz"
            echo '```'
          } >> body.md

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          TAG="$RELEASE_REF"
          # The signature set exists only when the opt-in signing step ran.
          # nullglob + the array keeps an unmatched `*.sig` from reaching gh
          # as a literal filename on unsigned releases.
          shopt -s nullglob
          sigs=(artifacts/*.sig)
          [ -f artifacts/ai-usagebar-signing-key.asc ] && \
            sigs+=("artifacts/ai-usagebar-signing-key.asc")
          # Replace any pre-existing assets so re-runs (workflow_dispatch on
          # an existing tag) overwrite cleanly.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 \
              ${sigs[@]+"${sigs[@]}"} \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          else
            gh release create "$TAG" artifacts/*.tar.gz artifacts/*.sha256 \
              ${sigs[@]+"${sigs[@]}"} \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file body.md \
              --latest
          fi

  publish-aur:
    needs: [verify-version, build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.ref != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # Compute the real sha256s and inject them into both PKGBUILDs so the
      # AUR deploy action publishes pinned hashes (the in-tree PKGBUILDs
      # carry `SKIP` between releases by convention — see docs/AGENT-NOTES.md).
      - name: Pin sha256s in PKGBUILDs
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          SRC_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA=$(curl -fsSL "$SRC_URL" | sha256sum | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('$SRC_SHA')/" packaging/aur/PKGBUILD

          X86_SHA=$(awk '{print $1}' artifacts/ai-usagebar-linux-x86_64.tar.gz.sha256)
          ARM_SHA=$(awk '{print $1}' artifacts/ai-usagebar-linux-aarch64.tar.gz.sha256)
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$X86_SHA' 'SKIP')/" packaging/aur/PKGBUILD-bin
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$ARM_SHA' 'SKIP')/" packaging/aur/PKGBUILD-bin

          # deploy-aur copies pkgbuild verbatim (preserves filename). The AUR
          # bin repo tracks a file literally named `PKGBUILD`, so stage the
          # `-bin` variant under that name. Without this, makepkg generates
          # .SRCINFO from the stale PKGBUILD and pushes an empty commit (the
          # mode that bit us in v0.4.4 — see CHANGELOG).
          mkdir -p staging/bin
          cp packaging/aur/PKGBUILD-bin staging/bin/PKGBUILD

      - name: Check AUR_SSH_KEY presence
        id: aur_key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping AUR push — no AUR_SSH_KEY secret set"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      # `KSXGitHub/github-actions-deploy-aur` spins up an Arch container,
      # regenerates .SRCINFO via makepkg, then commits + pushes via SSH.
      # Pinned to an immutable revision because this action receives the AUR
      # SSH private key and executes in the release trust boundary.
      - name: Publish ai-usagebar (source) to AUR
        if: steps.aur_key.outputs.set == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ai-usagebar
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: AkitaOnRails (GitHub Actions)
          commit_email: boss@akitaonrails.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "ai-usagebar ${{ inputs.ref || github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: 'false'

      - name: Publish ai-usagebar-bin to AUR
        if: steps.aur_key.outputs.set == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ai-usagebar-bin
          pkgbuild: ./staging/bin/PKGBUILD
          commit_username: AkitaOnRails (GitHub Actions)
          commit_email: boss@akitaonrails.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "ai-usagebar-bin ${{ inputs.ref || github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: 'false'
