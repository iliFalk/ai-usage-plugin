# ai-usagebar configuration. Lives at ~/.config/ai-usagebar/config.toml.
# Every section and field is optional — missing config = the defaults below.
#
# The Omarchy panel reads this file through `ai-usagebar settings show` and
# writes it through `ai-usagebar settings apply`, so editing it here by hand is
# the fallback, not the normal path.
#
# IMPORTANT: if you put an inline `api_key` in any section, chmod 600 the
# file (`chmod 600 ~/.config/ai-usagebar/config.toml`). ai-usagebar tightens
# the mode itself on load when it finds an inline key, but an env var is the
# safer choice.

[ui]
# Which provider the bar shows first, and which entry the panel opens on.
# Valid: opencode-go | openrouter | deepseek
# Unset → the first enabled provider.
# primary = "openrouter"
# Which providers the report lists first, in this order. Enabled providers left
# off the list follow in the canonical order. Omit the key for every enabled
# provider, in that canonical order.
# overview_vendors = ["openrouter", "deepseek", "opencode-go"]

[notifications]
# One desktop notification when a quota window crosses `threshold`, and a
# warning 48 hours before banked credits expire. One notification per crossing;
# it re-arms only after usage drops 7 points. Sent through `notify-send`.
enabled = true
# Whole percent, 1..=100. At 100 only an already exhausted window notifies.
threshold = 97

[opencode-go]
# Usage quota: a rolling 5-hour window, a weekly one and a monthly one.
# The key comes from OPENCODE_GO_API_KEY, from an inline `api_key`, or from the
# official OpenCode CLI's own login (~/.local/share/opencode/auth.json or
# opencode.db), read read-only.
enabled = false
# api_key_env = "OPENCODE_GO_API_KEY"
# api_key = "sk-..."
# Day of the month (1..=28) the billing cycle resets on. OpenCode Go reports
# only `resetsAt`, never the cycle length, so this is what lets the panel pace
# the monthly window exactly instead of guessing 30 days.
# monthly_cycle_day = 15
# Non-standard install: where to look for the CLI's own key. Read-only.
# auth_paths = ["~/.local/share/opencode/auth.json"]
# Monthly cycle start, as a Unix timestamp in milliseconds. Wins over
# `month_days` for pacing; `monthly_cycle_day` is the normal way to set it.
# month_start_ms = 1767225600000
# Fallback cycle length in days when neither of the above is set.
# month_days = 30
# Dollar limits for the three windows, used to turn the reported percentage
# into a spend figure. Defaults: 15 / 40 / 80.
# rolling_limit = 15.0
# weekly_limit = 40.0
# monthly_limit = 80.0

[openrouter]
# Credit balance, the key's own remaining limit, and recent-model activity.
# `/api/v1/credits` and `/api/v1/key`, over OPENROUTER_API_KEY.
enabled = true
# api_key_env = "OPENROUTER_API_KEY"
# api_key = "sk-or-v1-..."
# Optional management key, used only by `GET /api/v1/activity` (recent models).
# When it resolves to nothing that request is skipped rather than fired at a
# 401; the inference key is never sent there.
# management_api_key_env = "OPENROUTER_MANAGEMENT_API_KEY"
# Which number the bar shows: "percent" (default) or "amount".
# OpenRouter states its own denominator — credits purchased — so there is
# deliberately no `display_limit` here.
# headline = "percent"
# Named accounts. Each one gets its own entry in the report and its own cache
# directory. The default key above stays its own entry unless
# `show_default_account = false` while named accounts exist.
# show_default_account = true
# [[openrouter.accounts]]
# label = "work"
# api_key_env = "OPENROUTER_WORK_API_KEY"
# api_key = "sk-or-v1-..."
# management_api_key_env = "OPENROUTER_WORK_MANAGEMENT_API_KEY"

[deepseek]
# Account balance from `/user/balance`.
enabled = false
# api_key_env = "DEEPSEEK_API_KEY"
# api_key = "sk-..."
# Tank size in the balance's own currency, so the remaining amount can be drawn
# as a meter. Must be finite and greater than zero; remove it to show the
# balance without a limit.
# display_limit = 20.0
# Which number the bar shows: "amount" (default for a balance) or "percent".
# headline = "amount"
# show_default_account = true
# [[deepseek.accounts]]
# label = "work"
# api_key_env = "DEEPSEEK_WORK_API_KEY"
# api_key = "sk-..."
